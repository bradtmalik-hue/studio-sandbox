workflows:
  # 真正出安装包的那条：签名 + 归档 + 导出 ipa（可选上传 TestFlight）
  app-store:
    name: App Store (signed ipa)
    max_build_duration: 90
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bradtmalik-hue.plantcare
      vars:
        BUNDLE_ID: com.bradtmalik-hue.plantcare
    scripts:
      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles
      - name: Build signed ipa
        script: |
          set -e
          xcode-project build-ipa             --project "PlantCare.xcodeproj"             --scheme "PlantCare"             --config Release
      - name: Upload to TestFlight
        script: |
          set -e
          # 密钥三种来源都认：Codemagic 集成、手填变量、我们注入的 base64
          KEY_ID="${ASC_KEY_ID:-$APP_STORE_CONNECT_KEY_IDENTIFIER}"
          ISSUER="${ASC_ISSUER:-$APP_STORE_CONNECT_ISSUER_ID}"
          DEST="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname "$DEST")"
          if [ -n "$ASC_KEY_CONTENT" ]; then
            echo "$ASC_KEY_CONTENT" | base64 -d > "$DEST"
          elif [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            printf %s "$APP_STORE_CONNECT_PRIVATE_KEY" > "$DEST"; echo >> "$DEST"
          fi
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ ! -s "$DEST" ]; then
            echo "这个包没有上传到 TestFlight：App Store Connect 密钥还没配到 Codemagic。"
            echo "ipa 已经打好（构建产物里能下载），但苹果那边收不到。"
            echo "配法：Codemagic 团队设置 - Integrations - App Store Connect 添加一次，"
            echo "再在 codemagic.yaml 里写 integrations: app_store_connect: 你的名字。"
            exit 1
          fi
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "ipa: $IPA"
          xcrun altool --upload-app -f "$IPA" --type ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "已上传到 TestFlight"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "PlantCare.xcodeproj" \
            -scheme "PlantCare" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

  demo-capture:
    name: Store Screenshots (simulator)
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.bradtmalik-hue.plantcare
    scripts:
      - name: Build for simulator
        script: |
          set -e
          xcodebuild \
            -project "PlantCare.xcodeproj" \
            -scheme "PlantCare" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture each screen
        script: |
          set -e
          mkdir -p shots
          DT=$(xcrun simctl list devicetypes | grep -o "iPhone 16 Pro Max" | head -1)
          if [ -z "$DT" ]; then DT=$(xcrun simctl list devicetypes | grep -o "iPhone 16 Pro" | head -1); fi
          if [ -z "$DT" ]; then DT=$(xcrun simctl list devicetypes | grep -o "iPhone 15 Pro Max" | head -1); fi
          RT=$(xcrun simctl list runtimes | grep -o "com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*" | tail -1)
          DEV=$(xcrun simctl create Capture "$DT" "$RT")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APP="build/Build/Products/Release-iphonesimulator/PlantCare.app"
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl status_bar "$DEV" override --time "9:41" \
            --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          N=1
          for T in 0 1 2 3; do
            xcrun simctl terminate "$DEV" "$BUNDLE_ID" || true
            xcrun simctl launch "$DEV" "$BUNDLE_ID" -demoData -startTab "$T" >/tmp/launch_$T.txt 2>&1 || true
            # 等久一点：刚启动那几秒系统会弹通知（"Ready for Apple Intelligence"）盖住标题栏
            sleep 13
            # 冒烟：还活着吗？崩了的话进程就没了，记一个 crash 文件回去
            if xcrun simctl spawn "$DEV" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              echo "tab $T alive"
              # 连拍两帧取后一帧：系统通知（"Ready for Apple Intelligence"）
            # 通常几秒后自己收起来，第二张才是干净的（昨晚第一张标题被横幅压掉半截）
            xcrun simctl io "$DEV" screenshot "shots/_tmp_$N.png" || true
            sleep 6
            rm -f "shots/_tmp_$N.png"
            # 只有 App 还活着才截图：崩了截到的是手机桌面，
              # 桌面看起来"有内容"，会被后面的审稿误判成"页面还行"（真实踩过）。
              xcrun simctl io "$DEV" screenshot "shots/shot_$N.png" || true
            else
              echo "CRASH tab $T" > "shots/crash_$N.txt"
              echo "tab $T CRASHED"
            fi

            # 崩了就再拉一次，把 App 自己的报错输出抓下来（这是定位崩溃的唯一线索）
            if [ -f "shots/crash_$N.txt" ]; then
              # macOS 没有 timeout 命令（之前写 timeout 直接 command not found，
              # 控制台一直是空的）；改成后台跑 + 自己 kill。
              xcrun simctl launch --console-pty "$DEV" "$BUNDLE_ID" -demoData -startTab "$T"                 > "shots/console_$N.txt" 2>&1 &
              LPID=$!
              sleep 12
              kill $LPID 2>/dev/null || true
              # 系统日志里才有真正的崩因（Fatal error / EXC_BAD_ACCESS / 断言）
              xcrun simctl spawn "$DEV" log show --style compact --last 3m                 --predicate 'process == "PlantCare"' 2>/dev/null | tail -60 >> "shots/console_$N.txt" || true
              echo "--- console_$N ---"
              tail -30 "shots/console_$N.txt" || true
            fi

            # 再切一次前后台，很多崩溃只在恢复时出现
            xcrun simctl launch "$DEV" "$BUNDLE_ID" -demoData -startTab "$T" >/dev/null 2>&1 || true
            sleep 3
            if ! xcrun simctl spawn "$DEV" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              echo "CRASH on resume tab $T" >> "shots/crash_$N.txt"
            fi

            N=$((N+1))
          done
          # 持久化验证：不带 -demoData 重启，数据应该还在（说明真的写盘了）
          xcrun simctl terminate "$DEV" "$BUNDLE_ID" || true
          sleep 2
          xcrun simctl launch "$DEV" "$BUNDLE_ID" -startTab "0" >/tmp/launch_persist.txt 2>&1 || true
          sleep 9
          xcrun simctl io "$DEV" screenshot "shots/persist_1.png" || true
          if ! xcrun simctl spawn "$DEV" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
            echo "CRASH on relaunch (persistence check)" > "shots/crash_persist.txt"
          fi

          # 落盘取证：App 真的把数据写进沙盒了吗？（UserDefaults / Documents 两种都看）
          CONT=$(xcrun simctl get_app_container "$DEV" "$BUNDLE_ID" data 2>/dev/null || echo "")
          if [ -n "$CONT" ]; then
            (
              echo "=== container: $CONT"
              echo "--- Preferences"
              ls -la "$CONT/Library/Preferences" 2>/dev/null || echo "(没有 Preferences 目录)"
              for P in "$CONT"/Library/Preferences/*.plist; do
                [ -f "$P" ] || continue
                echo "--- plist: $(basename "$P")"
                plutil -p "$P" 2>/dev/null | head -40
              done
              echo "--- Documents"
              ls -la "$CONT/Documents" 2>/dev/null || echo "(没有 Documents 目录)"
              echo "--- Application Support"
              find "$CONT/Library/Application Support" -type f 2>/dev/null | head -10 || true
            ) > "shots/storage_1.txt" 2>&1
          else
            echo "NO_CONTAINER" > "shots/storage_1.txt"
          fi
          echo "--- storage_1 ---"; tail -20 "shots/storage_1.txt" || true

          # 有崩溃就把系统崩溃日志一起带走，方便定位
          if ls shots/crash_*.txt >/dev/null 2>&1; then
            mkdir -p shots/crashlogs
            find ~/Library/Logs/DiagnosticReports -name "*.ips" -mmin -10 2>/dev/null | head -3 | while read -r f; do cp "$f" shots/crashlogs/ 2>/dev/null || true; done
          fi
          ls -la shots
          cat shots/crash_*.txt 2>/dev/null || echo "no crash"
      - name: Upload shots to GitHub
        ignore_failure: true
        script: |
          python3 scripts/upload_shots.py
    artifacts:
      - shots/*.png
      - shots/crash_*.txt
      - shots/console_*.txt
      - shots/storage_*.txt
      - shots/crashlogs/*.ips

  demo-adhoc:
    name: Demo install (Ad Hoc)
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.bradtmalik-hue.plantcare
      vars:
        BUNDLE_ID: com.bradtmalik-hue.plantcare
        APP_NAME: PlantCare
    scripts:
      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles
      - name: Build ad hoc ipa
        script: |
          set -e
          xcode-project build-ipa --project "PlantCare.xcodeproj" --scheme "PlantCare" --config Release
      - name: Publish install page
        script: |
          set -e
          python3 scripts/ota_publish.py || true
    artifacts:
      - build/ios/ipa/*.ipa
